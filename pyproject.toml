[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-mcp"
version = "0.1.0"
description = "Modular MCP server unifying Notion and Supabase as searchable, safely-writable knowledge sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
nexus-mcp = "nexus_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise the full MCP client/server round trip",
  "live: opt-in smoke tests against real Notion/Supabase (need NEXUS_LIVE_TESTS=1 + credentials)",
]

[tool.coverage.run]
source = ["nexus_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]
