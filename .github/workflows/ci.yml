name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and validate distributions
        run: |
          uv build
          uvx --from twine twine check dist/*
          test "$(find dist -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
      - name: Install and exercise wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            temp_dir=$(mktemp -d)
            trap 'rm -rf "$temp_dir"' EXIT
            uv venv "$temp_dir/venv" --python 3.11
            uv pip install --python "$temp_dir/venv/bin/python" "$artifact"
            "$temp_dir/venv/bin/nexus-mcp" --check-config
            NEXUS_DEMO_MODE=true "$temp_dir/venv/bin/nexus-mcp" --check-config
            uvx --from "$artifact" nexus-mcp --check-config
            PATH="$temp_dir/venv/bin:$PATH" NEXUS_DEMO_MODE=true "$temp_dir/venv/bin/python" - <<'PY'
          import os
          import subprocess
          import time

          environment = {**os.environ, "NEXUS_DEMO_MODE": "true"}
          process = subprocess.Popen(["nexus-mcp"], stdin=subprocess.PIPE, env=environment)
          time.sleep(1)
          if process.poll() is not None:
              raise SystemExit("demo-mode server exited before startup completed")
          process.terminate()
          process.wait(timeout=5)
          PY
            rm -rf "$temp_dir"
            trap - EXIT
          done
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
        env: { UV_PYTHON: "${{ matrix.python-version }}" }
      - run: . .venv/bin/activate && ruff check . && ruff format --check .
      - run: . .venv/bin/activate && mypy
      - name: Test and measure coverage
        id: python-quality
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          . .venv/bin/activate
          set +e
          pytest -q \
            --cov=src/nexus_mcp \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=json:reports/coverage.json \
            --cov-report=html:reports/htmlcov \
            --junitxml=reports/pytest.xml \
            --cov-fail-under=95
          test_exit=$?
          set -e
          set -o pipefail
          echo "test_exit=$test_exit" >> "$GITHUB_OUTPUT"

          report_exit=0
          if [ -f reports/coverage.json ] && [ -f reports/pytest.xml ]; then
            python scripts/coverage_report.py reports/coverage.json \
              --junitxml reports/pytest.xml \
              --output-json reports/quality.json | tee -a "$GITHUB_STEP_SUMMARY"
            report_exit=$?
          else
            echo "### Python tests and coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage or JUnit output was unavailable." >> "$GITHUB_STEP_SUMMARY"
            report_exit=1
          fi
          echo "report_exit=$report_exit" >> "$GITHUB_OUTPUT"
      - name: Upload coverage and test reports
        if: matrix.python-version == '3.13' && always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-reports
          path: reports/
          if-no-files-found: error
      - name: Publish coverage
        if: matrix.python-version == '3.13' && steps.python-quality.outputs.test_exit == '0' && steps.python-quality.outputs.report_exit == '0'
        uses: coverallsapp/github-action@v2
        with:
          file: reports/coverage.xml
      - name: Enforce Python quality result
        if: always()
        shell: bash
        run: |
          test_exit="${{ steps.python-quality.outputs.test_exit }}"
          report_exit="${{ steps.python-quality.outputs.report_exit }}"
          if [ "$test_exit" != "0" ]; then
            echo "pytest/coverage exited with status $test_exit"
            exit "$test_exit"
          fi
          if [ "$report_exit" != "0" ]; then
            echo "coverage report generation exited with status $report_exit"
            exit "$report_exit"
          fi
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e . pip-audit
      - run: . .venv/bin/activate && pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm audit --omit=dev
        working-directory: clients/ts
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: clients/ts/package-lock.json }
      - run: npm ci && npm run typecheck && npm run build && npm test
        working-directory: clients/ts
  evals-selftest:
    # Keyless: proves the Promptfoo harness and its safety assertions still discriminate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run build
        working-directory: clients/ts
      - run: npm install --no-audit --no-fund && npm run selftest && node check-selftest.mjs
        working-directory: evals
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
